{% load url from future %}
{% load humanize %}

{% load bootstrap_toolkit %}
{% load timepiece_tags %}

  <li class="project_li" list_project_id="{{ project.id }}" >
  <div class="project_table project_table_appearance">    
    <div class="project_table_row project_coloured_row">
      <div class="project_table_cell project_expand" preloaded="{{ project.is_preloaded }}" onclick="imp.projects.load_or_display_issues(this, '{% url 'get_project_detail' project.id %}')"  >  
        <div class="draggable">
          <img src="{{STATIC_URL}}/images/icons/drag.png"/> 
        </div>
        <div style="float:left;margin-right:10px">
          {{project.name}}  
        </div>
        <a style="float:left;margin-right:10px" href="{% url 'sprint_export' project.id %}">Get CSV</a>      
        <div class="btn"  >
            <div class="to_expand_form_on_click" style="display:block;"  onclick="imp.projects.show_project_card_as_popup(event);return false" target_id="#b_card_{{business.id}}" project_card_url="{% url 'get_project_card_for_business'  business_id=business.id project_id=project.id  %}" business_id="{{ business.id }}" project_id="{{ project.id }}"> 
            Show Project Card
          </div>	
        </div> 
        <div id="b_card_{{business.id}}">
        </div>       
      </div> 

    </div>
    <div class="project_table_row project_contents">
      <div class="project_table_cell information">
        <img style="display:none" class="loading" src="{{STATIC_URL}}/images/icons/loadingAnimation.gif"/>
      </div>
    </div>
  </div>
  </li>
