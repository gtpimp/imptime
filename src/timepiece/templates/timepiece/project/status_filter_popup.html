<h3>Status filter</h3>

Click a status to only show issues with that status

<ul>
  <li>
    <a href="" onclick="return imp.filter_on_status({{project_id}}, '');">
      <i>All</i>
    </a>
{% for status in stati %}
  <li>
    <a href="" onclick="return imp.filter_on_status({{project_id}}, '{{status}}');">
      {{status}}
    </a>
  </li>
{% endfor %}
</ul>
