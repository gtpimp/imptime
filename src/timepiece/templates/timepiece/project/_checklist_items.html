<ul class="checklist_items">
  {% for item in checklist.items.all %}

  <li style="clear:left">

    {% if item.issue %}
    <a target="_blank" href="{% url 'highlighted_project_list' item.issue.project.id item.issue.id %}">
    {% elif item.project %}
    <a target="_blank" href="{% url 'project_list' item.project.id %}">
    {% else %}
    <span>
    {% endif %}

      <ul class="item_attributes">
        <li>
          <img src="{{STATIC_URL}}images/icons/{% if item.passed %}tick{% else %}cross{% endif %}.png"/>
        </li>
        <li>
          {{item.name}}
        </li>
        <li>
          {{item.msg}}
        </li>
      </ul>

    {% if item.issue or item.project %}
    </a>
    {% else %}
    </span>
    {% endif %}

  </li>

  {% empty %}
  <li><i>no problems</i></li>
  {% endfor %}

</ul>
