{% load bootstrap_toolkit %}

<div class="edit_budget">

  <h1>{{project.business.name}} - {{project.name}}</h1>
  <h2>Edit Sprint Budget</h2>

  <div class="row-fluid">
    <div class="span12">

      <br style="clear: both;" />

      <form id="create-edit-project" class="form-horizontal" action="{% url 'edit_project_budget' project.id %}" method="post" accept-charset="utf-8">
                {% csrf_token %}
		{{ project_form.errors }}
                {{ project_form }}
        <div class="form-actions">
          <input class="btn btn-primary" type='submit' name='submit' value='Save' onclick='imp.submit_popup_form(this); return false;' />
        </div>
      </form>
    </div>
  </div>
