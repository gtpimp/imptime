{% extends "timepiece/project/base.html" %}
{% load url from future %}
{% load humanize %}
{% block title %}Project Issues{% endblock %}
{% load bootstrap_toolkit %}
{% load timepiece_tags %}

{% block content %}
<script src="{{STATIC_URL}}timepiece/js/projects.js"></script>

<div class="projects">
  {% for project in projects %}    
  <div class="project_table project_table_appearance">    
    <div class="project_table_row project_coloured_row">
      <div class="project_table_cell project_expand" onclick="imp.projects.expand_issues(this, '{% url 'get_project_detail' project.id %}')"> <div style="float:left"> <img style="float:left" class="loading" src="{{STATIC_URL}}/images/icons/bullet_arrow_down.png"/> {{project.name}} </div> </div>       <div  class="project_table_cell"></div> 
    </div>
    <div class="project_table_row project_contents">
      <div class="project_table_cell information">
        <img style="display:none" class="loading" src="{{STATIC_URL}}/images/icons/loadingAnimation.gif"/>
      </div>
      <div class="project_table_cell" ><!-- spacer cell --> </div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
