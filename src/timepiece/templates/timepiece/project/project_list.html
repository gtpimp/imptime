{% extends "timepiece/project/base.html" %}
{% load url from future %}
{% load humanize %}
{% block title %}Project Issues{% endblock %}
{% load bootstrap_toolkit %}
{% load timepiece_tags %}

{% block content %}
<script src="{{STATIC_URL}}timepiece/js/projects.js"></script>
<img style="display:none" class="loading" src="{{STATIC_URL}}/images/icons/loadingAnimation.gif"/>

<div class="projects">
  {% for project in projects %}    
  <div class="project_table">    
    <div class="project_table_row">
      <div class="project_table_cell project_expand" onclick="imp.projects.expand_issues(this, '{% url 'get_project_detail' project.id %}')">V</div> <div  class="project_table_cell"> {{project.name}} </div>       
    </div>
    <div class="project_table_row project_contents">
      <div class="project_table_cell"></div><div class="project_table_cell information">BLA</div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
