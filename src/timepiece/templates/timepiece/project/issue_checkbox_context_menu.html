<ul class="contextMenuPlugin">
  <div class="gutterLine"></div>

  <li class="header">Issues Bulk Operation</li>
  <li class="header">({{num_issues}} issues)</li>

  {% for other_project in other_projects %}
    <li> <a href="{% url bulk_move_issues_to_project other_project.id %}">Move to {{other_project}}</a> </li>
  {% endfor %}

  <li class="divider"></li>

  <li> 
    <form method="GET" action='{% url bulk_change_issue_state %}'>
      {{state_change_form.as_p}}
    </form>
  </li>

  <li> 
    <form method="GET" action='{% url bulk_change_issue_feature %}'>
      {{feature_change_form.as_p}}
    </form>
  </li>

  <li> 
    <form method="GET" action='{% url bulk_change_issue_assignee %}'>
      {{assignee_change_form.as_p}}
    </form>
  </li>


  <li class="divider"></li>

</ul>
