{% extends "timepiece/base.html" %}
{% load bootstrap_toolkit %}
{% block title %}Profile{% endblock %}

{% block crumbs %}
    {{ block.super }}
    <li><span class="divider">/</span> <a href="{% url 'edit_settings' %}">Profile</a></li>
{% endblock crumbs %}

{% block content %}
    <div class="row-fluid">
        <div class="span12">
            <h2>Profile</h2>

            <br style="clear: both;" />

            <form class="form-horizontal" id="create-edit-person" action="" method="post" accept-charset="utf-8">
                {% csrf_token %}
                {{ user_form }}
                {{ profile_form }}
                <div class="form-actions">
                    <input class="btn btn-primary" type="submit" value="Save" name="submit">
                    <input class="btn" type="button" onclick="history.go(-1)" value="Cancel">
                </div>
            </form>
        </div>
    </div>
{% endblock %}
