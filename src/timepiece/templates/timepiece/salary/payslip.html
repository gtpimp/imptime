{% extends "timepiece/project/base.html" %}
{% load url from future %}
{% block title %}Payslip{% endblock %}
{% load bootstrap_toolkit %}

{% block content %}

<div class="row-fluid">

  <h2>Payslip for {{user.username}}</h2>

  <div class="row-fluid">
    <div class="span12">
      <form class="form-inline" method="get" action="" id="date-filter" accept-charset="utf-8">
	{{ date_form|as_bootstrap:"inline" }}
	<input class="btn" type="submit" name="submit" value="Update" id="id_date_form_submit_btn"/>
	<input class="btn" type="button" name="clear" value="Clear" id="id_date_form_clear_btn"/>
      </form>
    </div>
  </div>

  <div class="row-fluid">
    <form class="form-inline" method="post" action="" accept-charset="utf-8">
      {% csrf_token %}
      <table>
	{{ salary_form.as_table }}
      </table>
      <input type="submit" value="update">
    </form>
  </div>

  <div>
    <a href="{% url 'salary_payslip' user_id=user.id preview=1 %}">Generate</a>
  </div>

</div>

{% endblock %}
