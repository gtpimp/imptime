{% extends "timepiece/base.html" %}
{% load bootstrap3 %}

{% block extrajs %}
  <script src="{{STATIC_URL}}fullcalendar/lib/moment.min.js"></script>
  <script src="{{STATIC_URL}}fullcalendar/lib/jquery-ui.custom.min.js"></script>
  <script src="{{STATIC_URL}}fullcalendar/fullcalendar.min.js"></script>
  

  <script>
    $(document).ready(function() {
		
		$('#calendar').fullCalendar({
			header: {
				left: 'prev,next today',
				center: 'title',
				right: 'month,agendaWeek,agendaDay'
			},
			defaultDate: '2014-06-12',
			editable: true,
			events: [
				{
					title: 'All Day Event',
					start: '2014-06-01'
				},
				{
					title: 'Long Event',
					start: '2014-06-07',
					end: '2014-06-10'
				},
				{
					id: 999,
					title: 'Repeating Event',
					start: '2014-06-09T16:00:00'
				},
				{
					id: 999,
					title: 'Repeating Event',
					start: '2014-06-16T16:00:00'
				},
				{
					title: 'Meeting',
					start: '2014-06-12T10:30:00',
					end: '2014-06-12T12:30:00'
				},
				{
					title: 'Lunch',
					start: '2014-06-12T12:00:00'
				},
				{
					title: 'Birthday Party',
					start: '2014-06-13T07:00:00'
				},
				{
					title: 'Click for Google',
					url: 'http://google.com/',
					start: '2014-06-28'
				}
			]
		});
		
	});
  </script>

{% endblock %}

{% block extracss %}
  <link type="text/css" rel="stylesheet" href="{{ STATIC_URL }}fullcalendar/fullcalendar.css" />
  <link type="text/css" rel="stylesheet" href="{{ STATIC_URL }}timepiece/css/timepiece_fullcalendar.css" />
  <link href='{{ STATIC_URL }}fullcalendar/fullcalendar.print.css' rel='stylesheet' media='print' />
{% endblock %}

{% block title %}Calendar{% endblock %}

{% block content %}

<form class="filter_form" method="POST" action="{% url 'calendar'%}">
  
      {% csrf_token %}

  <div class='form-group{% if filter_form.errors.users%} has-error{%endif%}'>
    <div class="col-md-6">
          <h3>Users</h3>
    </div>
    <div class="col-md-6">
          {{ filter_form.users }}
    </div>
  </div>

  <div class='form-group{% if filter_form.errors.sprints%} has-error{%endif%}'>
    <div class="col-md-6">
          <h3>Sprints</h3>
    </div>
    <div class="col-md-6">
          {{ filter_form.projects }}
    </div>
  </div>

  <div class='form-group'>
    <input class="btn btn-primary" type="submit" value="Filter"/>
  </div>
  
</form>

<div id='calendar'></div>

{% endblock %}
