<form class="box event_edit_form" method="POST" style="display:none" action="{% url 'update_calendar_event' 999999 %}">
    {% csrf_token %}

    <h2>Edit event</h2>

    <input type="hidden" name="event_id"/>

    <div class='form-group{% if update_form.errors.start %} has-error{%endif%}'>
      <div class="col-md-6">
        <h3>Start</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.start }}
      </div>
    </div>

    <div class='form-group{% if update_form.errors.end %} has-error{%endif%}'>
      <div class="col-md-6">
        <h3>End</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.end }}
      </div>
    </div>

    <div class='form-group{% if update_form.errors.user%} has-error{%endif%}'>
      <div class="col-md-6">
            <h3>User</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.user }}
      </div>
    </div>

    <div class='form-group{% if update_form.errors.project %} has-error{%endif%}'>
      <div class="col-md-6">
            <h3>Project</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.project }}
      </div>
    </div>

    <div class='form-group{% if update_form.errors.hours %} has-error{%endif%}'>
      <div class="col-md-6">
            <h3>Hours</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.hours }}
      </div>
    </div>

    <div class='form-group{% if update_form.errors.description %} has-error{%endif%}'>
      <div class="col-md-6">
            <h3>Description</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.description }}
      </div>
    </div>

    <div class='form-group'>
      <div class="col-md-12">
        <input class="btn btn-primary" type="submit" value="Save" onclick="t_calendar.update_event(this); return false;" />
        <input class="btn btn-secondary" type="submit" value="Cancel" onclick="$(this).parents('form').hide(); return false;" />
        <input class="btn btn-warning" type="submit" value="Delete" onclick="t_calendar.delete_event(this); return false;" />
      </div>
    </div>

    <div style="clear:both"></div>

</form>
