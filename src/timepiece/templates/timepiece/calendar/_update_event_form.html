<form class="box event_edit_form" method="POST" style="display:none" action="{% url 'update_calendar_event' 999999 %}">
    {% csrf_token %}

    <h2>Update an Existing Event</H2>

    <INPUT TYPE="HIDDEN" NAME="EVENT_ID"/>

    <div class ='form-group{%if update_form.erroes.start%} has-error{%endif%}'>
	<div class="col-md-6">
	    <h3>Start</h3>
	</div>
	<div class="col-md-d">
{{update_form.start}}
	</div>
    </div>


    <div class='form-group{% if update_form.errors.hours %} has-error{%endif%}'>
      <div class="col-md-6">
            <h3>Hours</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.hours }}
      </div>
    </div>

    <div class='form-group{% if update_form.errors.user%} has-error{%endif%}'>
      <div class="col-md-6">
            <h3>User</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.user }}
      </div>
    </div>

    <div class='form-group{% if update_form.errors.project %} has-error{%endif%}'>
      <div class="col-md-6">
            <h3>Project</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.project }}
      </div>
    </div>

    <div class='form-group{% if update_form.errors.event_type %} has-error{%endif%}'>
      <div class="col-md-6">
        <h3>Type</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.event_type }}
      </div>
    </div>

  <div class='form-group{% if update_form.errors.status %} has-error{%endif%}'>























    <div class="col-md-6">
      <h3>Status</h3>
    </div>
    <div class="col-md-6">
            {{ update_form.status }}
    </div>
  </div>

    <div class='form-group{% if update_form.errors.description %} has-error{%endif%}'>
      <div class="col-md-6">
            <h3>Description</h3>
      </div>
      <div class="col-md-6">
            {{ update_form.description }}
      </div>
    </div>

    <div class='form-group'>
      <div class="col-md-12">
        <input class="btn btn-primary event_edit_button" type="submit" value="Save" onclick="t_calendar.update_event(this); return false;" />
        <input class="btn btn-secondary" type="submit" value="Cancel" onclick="$(this).parents('form').hide(); return false;" />
        <input class="btn btn-warning event_edit_button" type="submit" value="Delete" onclick="t_calendar.delete_event(this); return false;" />
        <input class="btn btn-secondary" type="submit" value="View day" onclick="t_calendar.switch_to_day_view(); return false;" />
        <div class="edit_msg tip"></div>
      </div>
    </div>

    <div style="clear:both"></div>

</form>
