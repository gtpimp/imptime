{% extends "slideshow/base.html" %}

{% load timepiece_tags %}{% load bootstrap_toolkit %}
{% block content %}

    {% for business, graph_info_list in plot_data.items %}
        <div>
            <h3>{{ business }}</h3>

            <div style="width:100%; height:900px" class="timesheet_graph_container" id="test"></div>
        </div>
    {% endfor %}



    <script>
        function line(label, starting_x, starting_y, length, colour) {
            return {
                label: label,
                data: [[starting_x, starting_y], [starting_x + length, starting_y]],
                color: colour,
                hoverable: true,
                ratio: length
            }
        }

        function createLinePerSprint(starting_y, managerRatio, developerRatio, testerRatio) {
            var x1 = 0;
            var x2 = x1 + managerRatio;
            var x3 = x2 + developerRatio;

            return [
                line('Manager', x1, starting_y, managerRatio, 'red'),
                line('Dev', x2, starting_y, developerRatio, 'green'),
                line('Tester', x3, starting_y, testerRatio, 'blue')
            ];
        }

        var data_points = [];
        var labels = [];
        var y = 4.0;

        {% for business, graph_info_list in plot_data.items %}
            {% for item in graph_info_list %}
                data_points = data_points.concat(createLinePerSprint(y, {{ item.values.manager_rate }}, {{ item.values.developer_rate }}, {{ item.values.tester_rate }}));
                labels.push([y, "{{ item.project }}" + " &nbsp;"]);
                y += 4;
            {% endfor %}
        {% endfor %}

        $(document).ready(
                function () {
                    $.plot($("#test"),
                            data_points,
                            {
                                series: {
                                    lines: {show: true, fill: false},
                                    points: {show: true, fill: false}
                                },
                                xaxis: {
                                    position: 'top',
                                    tickSize: 10,
                                    min: 0.0,
                                    max: 100.0
                                },
                                yaxis: {
                                    show: true,
                                    position: 'left',
                                    tickSize: 10,
                                    ticks: labels,
                                    min: 0.0,
                                    max: 100.0,
                                    transform: function (v) {
                                        return -v;
                                    },
                                    inverseTransform: function (v) {
                                        return -v;
                                    }
                                },
                                grid: {
                                    show: true,
                                    aboveData: false,
                                    hoverable: true,
                                    clickable: true
                                },
                                legend: {
                                    show: false,
                                    position: "ne"
                                },
                                bars: {
                                    show: false
                                }
                            }
                    );

                    $("#test").bind("plothover", function (event, pos, item) {
                        {#                        alert("You hover at " + pos.x + ", " + pos.y);#}
                        // axis coordinates for other axes, if present, are in pos.x2, pos.x3, ...
                        // if you need global screen coordinates, they are pos.pageX, pos.pageY

                        if (item) {
                            {#                            highlight(item.series, item.datapoint);#}
                            alert("You hover a line!");
                        }
                    });

                });

    </script>

{% endblock %}

{% block reload %}

{% endblock %}
