upstream application_server_{{upstream_name_suffix}} {
  server {{application_dns}};
}

server {
    listen 443;
    server_name {{dotted_dns_subdomain}}{{dns_domain}};

    access_log /opt/imptime/logs/imptime-proxy-access.443.log;
    error_log /opt/imptime/logs/imptime-proxy-error.443.log;

    set $maintenance off;
    include /opt/imptime/maintenance_conf/*.conf;
    if ($maintenance = on) {
      return 503;
    }
    location /maintenance {
    }
    error_page 503 @maintenance;
    location @maintenance {
      root /var/www/maintenance_website;
      if ( $uri !~ ^/(index\.php|css|images|core|uploads|js|robots\.txt|favicon\.ico) ) {
         rewrite ^(.*)$ /index.html break;
      }       
    }

    ssl on;
    ssl_certificate /etc/nginx/certs/imptime.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/imptime.com/privkey.pem;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_prefer_server_ciphers on;

    return 301 https://app.{{dotted_dns_subdomain}}{{dns_domain}};
}

server {
    listen 443;
    server_name api.{{dotted_dns_subdomain}}{{dns_domain}};
    client_max_body_size 4G;
    access_log /opt/imptime/logs/imptime-proxy-access.{{dotted_dns_subdomain}}api.log;
    error_log /opt/imptime/logs/imptime-proxy-error.{{dotted_dns_subdomain}}api.log;

    set $maintenance off;
    include /opt/imptime/maintenance_conf/*.conf;
    if ($maintenance = on) {
      return 503;
    }
    location /maintenance {
    }
    error_page 503 @maintenance;
    location @maintenance {
      root /var/www/maintenance_website;
      if ( $uri !~ ^/(index\.php|css|images|core|uploads|js|robots\.txt|favicon\.ico) ) {
         rewrite ^(.*)$ /index.html break;
      }       
    }

    location / {
        proxy_pass         http://application_server_{{upstream_name_suffix}};
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host $server_name;

        proxy_connect_timeout       300;
        proxy_send_timeout          300;
        proxy_read_timeout          300;
        send_timeout                300;

    }

    ssl on;
    ssl_certificate /etc/nginx/certs/imptime.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/imptime.com/privkey.pem;
    
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2; 
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_prefer_server_ciphers on;
}

