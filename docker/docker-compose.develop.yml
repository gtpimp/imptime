version: '2'

volumes:
  static-assets:

services:

  daphne-worker-1:
    image: imptime/django-local-sources-dev
    build:
      context: ../
      dockerfile: docker/Dockerfile-django-local-sources-dev
    entrypoint: ./start-daphne-worker-local-sources-dev.sh
    volumes:
     - ../:/opt/imptime

  django:
    image: imptime/django-local-sources-dev
    build:
      context: ../
      dockerfile: docker/Dockerfile-django-local-sources-dev
    volumes:
     - ../:/opt/imptime

  django-migrate:
    image: imptime/django-local-sources-dev
    build:
      context: ../
      dockerfile: docker/Dockerfile-django-local-sources-dev
    entrypoint: ./start-migrate-local-sources-dev.sh
    volumes:
     - ../:/opt/imptime
     - ../external_config/:/opt/imptime/src/implicitdesign/external_config/

  nginx:
    image: imptime/nginx-local-sources-dev
    build:
      context: ../
      dockerfile: docker/Dockerfile-nginx-local-sources-dev
    volumes:
      - ../:/opt/imptime

  react-static-assets-deployer:
    image: imptime/react-static-assets-deployer-local-sources-dev
    build:
      context: ../
      dockerfile: docker/Dockerfile-react-static-assets-deployer-local-sources-dev
    volumes:
      - ../:/opt/imptime
