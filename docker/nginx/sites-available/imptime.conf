upstream django {
    server django:8000;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/imptime-access.80.log;
    error_log /var/log/nginx/imptime-error.80.log;

    return 301 https://$host$request_uri;
}

server {

     listen 443;
     server_name localhost;

     root /opt/imptime/static-assets/;

     client_max_body_size 4G;

     access_log /var/log/nginx/imptime-access.443.log;
     error_log /var/log/nginx/imptime-error.443.log;

    location / {
    }

     ssl on;
     ssl_certificate /etc/nginx/ssl/certificate.crt;
     ssl_certificate_key /etc/nginx/ssl/certificate.key;
     ssl_session_timeout 5m;
     ssl_protocols TLSv1.2; 
     ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
     ssl_prefer_server_ciphers on;
}

server {

     listen 8443;
     server_name localhost;

     root /opt/imptime/;

     client_max_body_size 4G;

     access_log /var/log/nginx/imptime-access.443.log;
     error_log /var/log/nginx/imptime-error.443.log;

     location / {
         proxy_pass         http://django;
         proxy_redirect     off;
         proxy_set_header   Host $host;
         proxy_http_version 1.1;
         proxy_set_header   Upgrade $http_upgrade;
         proxy_set_header   Connection "upgrade";
         proxy_set_header   X-Real-IP $remote_addr;
         proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header   X-Forwarded-Host $server_name;
     }

     ssl on;
     ssl_certificate /etc/nginx/ssl/certificate.crt;
     ssl_certificate_key /etc/nginx/ssl/certificate.key;
     ssl_session_timeout 5m;
     ssl_protocols TLSv1.2;
     ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
     ssl_prefer_server_ciphers on;
}

