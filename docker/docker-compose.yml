version: '2'

services:

  django:
    build:
      context: ./
      dockerfile: Dockerfile-django
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
     - ../:/opt/imptime

  nginx:
    build:
      context: ./
      dockerfile: Dockerfile-nginx
    ports:
     - "80:80"
     - "443:443"
    depends_on:
      - django
    volumes:
      - ../:/opt/imptime

  postgres:
    build:
      context: ./
      dockerfile: Dockerfile-postgres
    ports:
      - "5432:5432"
    volumes:
      - ../:/opt/imptime

  react-dev:
    build:
      context: ./
      dockerfile: Dockerfile-react-dev
    volumes:
      - ../:/opt/imptime

  redis:
    image: redis:3.2-alpine
    ports:
        - "6379:6379"

