upstream api {
    server api:8002;
}

server {

     listen 80;
     server_name ui.*;
     
     root /opt/imptime;

     client_max_body_size 4G;

     access_log /var/log/nginx/imptime-access.ui.log;
     error_log /var/log/nginx/imptime-error.ui.log;

     location /static/ {
         alias   /opt/imptime/static_collected/;
     }

     location /local_settings/ {
              try_files /external_config/react_local_settings.js =404;
     }

     location / {
             autoindex on;
             try_files $uri /static/public/index.html;
     }

     add_header         X-Frame-Options DENY;
     add_header         X-Content-Type-Options nosniff;
     add_header         X-XSS-Protection "1; mode=block";
     add_header         X-Permitted-Cross-Domain-Policies none;
}

server {

     listen 80;
     server_name api.*;

     root /opt/imptime/api;

     client_max_body_size 4G;

     access_log /var/log/nginx/imptime-access.api.log;
     error_log /var/log/nginx/imptime-error.api.log;

     location /static/ {
         alias   /opt/imptime/static_collected/;
     }

     location / {
             proxy_pass         http://api;
             proxy_redirect     off;
             proxy_set_header   Host $host;
             proxy_http_version 1.1;
             proxy_set_header   Upgrade $http_upgrade;
             proxy_set_header   Connection "upgrade";
             proxy_set_header   X-Real-IP $remote_addr;
             proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header   X-Forwarded-Host $server_name;
     }

     add_header         X-Content-Type-Options nosniff;
     add_header         X-XSS-Protection "1; mode=block";
     add_header         X-Permitted-Cross-Domain-Policies none;

}
