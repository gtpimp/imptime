upstream api {
    server api:8002;
}

server {
    listen 80;

    access_log /var/log/nginx/imptime-access.80.log;
    error_log /var/log/nginx/imptime-error.80.log;

    return 301 https://$host$request_uri;
}

server {

     listen 443;
     server_name ui.*;

     root /opt/imptime;

     client_max_body_size 4G;

     access_log /var/log/nginx/imptime-access.ui.log;
     error_log /var/log/nginx/imptime-error.ui.log;

     location /static/ {
         alias   /opt/imptime/static_collected/;
     }

     location /local_settings/ {
              try_files /external_config/react_local_settings.js =404;
     }

     location / {
             autoindex on;
             try_files $uri /static/public/index.html;
     }

     ssl on;
     ssl_certificate /opt/imptime/external_config/imptime_certificate.crt;
     ssl_certificate_key /opt/imptime/external_config/imptime_certificate.key;
     ssl_session_timeout 5m;
     ssl_protocols TLSv1.2; 
     ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
     ssl_prefer_server_ciphers on;
}

server {

     listen 443;
     server_name api.*;

     root /opt/imptime/api;

     client_max_body_size 4G;

     access_log /var/log/nginx/imptime-access.api.log;
     error_log /var/log/nginx/imptime-error.api.log;

     location /static/ {
         alias   /opt/imptime/static_collected/;
     }

     location / {
             proxy_pass         http://api;
             proxy_redirect     off;
             proxy_set_header   Host $host;
             proxy_http_version 1.1;
             proxy_set_header   Upgrade $http_upgrade;
             proxy_set_header   Connection "upgrade";
             proxy_set_header   X-Real-IP $remote_addr;
             proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header   X-Forwarded-Host $server_name;
     }

     ssl on;
     ssl_certificate /opt/imptime/external_config/imptime_certificate.crt;
     ssl_certificate_key /opt/imptime/external_config/imptime_certificate.key;
     ssl_session_timeout 5m;
     ssl_protocols TLSv1.2; 
     ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
     ssl_prefer_server_ciphers on;
}
