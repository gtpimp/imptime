<!doctype html>
<html lang="en" style="height:100%; width: 100%;">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="shortcut icon" href="%PUBLIC_URL%/imptime_icon.png">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Fira+Sans:300,400,500" rel="stylesheet">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
        <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
        <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
        <link rel="manifest" href="/manifest.json">
        <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
        <meta name="theme-color" content="#ffffff">
        <script type="text/javascript" src="/local_settings/"></script>
        <script defer src="https://use.fontawesome.com/releases/v5.0.6/js/all.js"></script>
        <title>ImpTime</title>

        <style>
         .init .header {
             align-items: center;
             background: linear-gradient(#0b8bb2, #056a86),
             display: flex;
             height: 36px;
             justify-content: center;
             width: 100%
         }

         .init .block {
             text-align: center;
             width: 100%;
         }

         .init .block--message {
             padding-top: 64px;
         }

         .init .block--link {
             padding-top: 54px;

         }

         .init .block__content {
             display: inline-block;
             color: rgba(0, 0, 0, 0.87);
             font-family: 'Fira Sans';
             font-size: 32px;
             line-height: 40px;
             max-width: 328px;
         }

         @media (min-width: 720px) {
             .init .block__content {
                 font-size: 40px;
                 line-height: 47px;
                 max-width: 484px;
             }
         }

         .init .block__link {
             display: inline-block;
             color: #555500;
             font-family: 'Fira Sans';
             font-size: 16px;
             line-height: 19px;
             max-width: 484px;
             text-align: center;
         }

         .init a.block__link, .init a.block__link:visited, .init a.block__link:active, .init a.block__link:focus {
             background-position: center right;
             background-repeat: no-repeat;
             background-size: 8px 12px;
             padding-right: 18px;
             text-decoration: none;
         }

         /* html {
             overflow: scroll;
             overflow-x: hidden;
         }
         ::-webkit-scrollbar {
             width: 0px;
             background: transparent;
         }*/
        </style>
        
    </head>
    <body style="height:100%; width: 100%; overflow: hidden;" >
      <div id="modal-root"></div>
      <div id="root" style="height:100%; width: 100%; background: #e6eef0;">

        <div class="init">

          <div class="header">
          </div>
          <div id="loading_msg" class="block block--message"
               style="display:none;background-repeat:no-repeat; height:500px; background-position:center;margin-top:20px;opacity:0.5;color:black;">
            <div class="block__content" style="opacity:1; color:black">
              <div >
                ImpTime
                <br/>
              </div>
              <div style="font-size:20px">
                <br/>
                Loading...
                <br/>
                Please wait a few moments
              </div>
            </div>
          </div>
        </div>

        <script>
         setTimeout(function() {
             var el = document.getElementById("loading_msg");
             if ( el ) {
                 el.style.display = "block";
             }
         }, 10);
        </script>

      </div>
    </body>
</html>
