upstream application_server {
    server 34.251.212.69;
    #server 52.210.171.236;
}

server {
    listen 80;

    access_log /var/log/nginx/imptime-access.80.log;
    error_log /var/log/nginx/imptime-error.80.log;

    if ($host = 'careerimptime.com') {
       return 301 https://www.careerimptime.com;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443;
    server_name careerimptime.com;

    access_log /var/log/nginx/imptime-access.80.log;
    error_log /var/log/nginx/imptime-error.80.log;

     ssl on;
     ssl_certificate /etc/letsencrypt/live/careerimptime.com/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/careerimptime.com/privkey.pem;
     ssl_session_timeout 5m;
     ssl_protocols TLSv1.2;
     ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
     ssl_prefer_server_ciphers on;

    return 301 https://www.careerimptime.com;
}

server {
     listen 443;
     server_name clients.*;

     client_max_body_size 4G;

     access_log /var/log/nginx/imptime-access.client.log;
     error_log /var/log/nginx/imptime-error.client.log;

#     if ($remote_addr != 92.239.158.247) {
#        rewrite ^ https://maintenance.careerimptime.com;
#    }

     location / {
     proxy_pass         http://application_server;
     proxy_redirect     off;
     proxy_set_header   Host $host;
     proxy_http_version 1.1;
     proxy_set_header   Upgrade $http_upgrade;
     proxy_set_header   Connection "upgrade";
     proxy_set_header   X-Real-IP $remote_addr;
     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header   X-Forwarded-Host $server_name;
}

     ssl on;
     ssl_certificate /etc/letsencrypt/live/api.careerimptime.com/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/api.careerimptime.com/privkey.pem;
     ssl_session_timeout 5m;
     ssl_protocols TLSv1.2;
     ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
     ssl_prefer_server_ciphers on;
}

